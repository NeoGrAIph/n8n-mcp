name: CI

on:
  push:
    branches:
      - fork/2.40.2
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Synestra n8n GitOps MCP
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run source verification
        run: npm run verify

      - name: Build container image
        run: docker build -t synestra-n8n-gitops-mcp:ci .
